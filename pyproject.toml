    { name = "manjit10010-creator", email = "manjit10010@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=2.33.0",
    "python-dotenv>=1.2.4",
    "requests>=2.31.0",
]

[tool.uv]
package = false
